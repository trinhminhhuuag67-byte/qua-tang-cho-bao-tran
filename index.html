<!DOCTYPE html>
<htm lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chúc mừng sinh nhật nha</title>
    <style>
        body {
            background-color: #070714;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .flower-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10vmin;
            cursor: pointer; /* Thêm con trỏ để chỉ ra rằng có thể nhấp vào */
        }

        .flower-container {
            position: relative;
            transform-origin: bottom center;
            animation: grow-stem 2s forwards;
            opacity: 0;
        }

        /* Tạo độ trễ mọc lên cho từng cụm hoa */
        .flower-container:nth-child(1) { animation-delay: 0.5s; transform: scale(0.8) rotate(-10deg); }
        .flower-container:nth-child(2) { animation-delay: 1.5s; transform: scale(1.1); margin-bottom: 5vmin; }
        .flower-container:nth-child(3) { animation-delay: 1s; transform: scale(0.9) rotate(15deg); }

        /* Cành hoa */
        .stem {
            width: 1.2vmin;
            height: 45vmin;
            background: linear-gradient(to top, #146c43, #198754);
            border-radius: 5vmin;
            box-shadow: inset 0 0 1vmin rgba(0, 255, 136, 0.5);
        }

        /* Khu vực hoa nở */
        .flower__leafs {
            position: absolute;
            top: -2vmin;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Hiệu ứng hào quang phát sáng như trong video */
        .flower__leafs::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -100%);
            width: 15vmin;
            height: 15vmin;
            background-color: #ff2190;
            filter: blur(10vmin);
            animation: pulse-glow 3s infinite alternate;
            z-index: -1;
        }

        /* Các cánh hoa */
        .petal {
            position: absolute;
            width: 6vmin;
            height: 14vmin;
            background: linear-gradient(to top, #ff2190, #ff6eb4);
            border-radius: 50% 50% 10% 10%;
            transform-origin: bottom center;
            bottom: 0;
            left: -3vmin;
            opacity: 0;
            box-shadow: 0 0 2vmin #ff2190;
        }

        /* Animation nở hoa cho từng cánh */
        .flower-container:nth-child(1) .petal { animation: bloom 2s forwards 2.0s; }
        .flower-container:nth-child(2) .petal { animation: bloom 2s forwards 3.0s; }
        .flower-container:nth-child(3) .petal { animation: bloom 2s forwards 2.5s; }

        .petal--1 { --r: -40deg; }
        .petal--2 { --r: -15deg; }
        .petal--3 { --r: 15deg; }
        .petal--4 { --r: 40deg; }

        /* Các đốm sáng bay quanh hoa (Mã y hệt video) */
        .flower__light {
            position: absolute;
            width: 1vmin;
            height: 1vmin;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 2vmin #fff, 0 0 4vmin #ff2190;
            opacity: 0;
        }

        /* Áp dụng animation cho đốm sáng */
        .flower-container:nth-child(1) .flower__light { animation: float-light 3s infinite alternate 2.5s; }
        .flower-container:nth-child(2) .flower__light { animation: float-light 3s infinite alternate 3.5s; }
        .flower-container:nth-child(3) .flower__light { animation: float-light 3s infinite alternate 3.0s; }

        .flower__light--1 { left: -2vmin; bottom: 5vmin; animation-delay: 1s !important; }
        .flower__light--2 { left: 3vmin; bottom: 8vmin; animation-delay: 0.5s !important; }
        .flower__light--3 { left: -6vmin; bottom: 12vmin; animation-delay: 0.3s !important; }
        .flower__light--4 { left: 6vmin; bottom: 10vmin; animation-delay: 0.9s !important; }
        .flower__light--5 { left: -1vmin; bottom: 15vmin; animation-delay: 1.5s !important; }

        /* --- KEYFRAMES (Các hiệu ứng chuyển động) --- */
        @keyframes grow-stem {
            0% { transform: scaleY(0) var(--base-transform, scale(1)); opacity: 0; }
            100% { transform: scaleY(1) var(--base-transform, scale(1)); opacity: 1; }
        }

        @keyframes bloom {
            0% { transform: scale(0) rotate(var(--r)); opacity: 0; }
            100% { transform: scale(1) rotate(var(--r)); opacity: 1; }
        }

        @keyframes pulse-glow {
            0% { filter: blur(8vmin); opacity: 0.6; }
            100% { filter: blur(12vmin); opacity: 1; }
        }

        @keyframes float-light {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vmin) scale(1.5); opacity: 0; }
        }

        /* --- PHẦN MỚI: Khung chúc mừng sinh nhật --- */
        .birthday-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* Nền mờ tối */
            display: none; /* Ẩn theo mặc định */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .birthday-overlay.active {
            display: flex;
            opacity: 1;
        }

        .birthday-content {
            background-color: #1a1a2e; /* Nền khung */
            padding: 5vmin 8vmin;
            border-radius: 20px;
            text-align: center;
            position: relative;
            max-width: 80%;
            border: 2px solid #ff2190;
            box-shadow: 0 0 30px rgba(255, 33, 144, 0.7);
            transform: scale(0.7);
            transition: transform 0.5s ease-out;
        }

        .birthday-overlay.active .birthday-content {
            transform: scale(1);
        }

        .close-frame {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-frame:hover {
            color: #ff2190;
        }

        .birthday-content h1 {
            color: #ff2190;
            font-size: 6vmin;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 33, 144, 0.8), 0 0 20px rgba(255, 33, 144, 0.5);
            animation: text-glow 2s infinite alternate;
        }

        .birthday-content p {
            color: #fff;
            font-size: 3vmin;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        @keyframes text-glow {
            0% { text-shadow: 0 0 10px rgba(255, 33, 144, 0.8), 0 0 20px rgba(255, 33, 144, 0.5); }
            100% { text-shadow: 0 0 15px rgba(255, 33, 144, 1), 0 0 30px rgba(255, 33, 144, 0.8); }
        }

    </style>
</head>
<body>

    <div class="flower-wrapper">
        <div class="flower-container" style="--base-transform: scale(0.8) rotate(-10deg);">
            <div class="stem"></div>
            <div class="flower__leafs">
                <div class="petal petal--1"></div>
                <div class="petal petal--2"></div>
                <div class="petal petal--3"></div>
                <div class="petal petal--4"></div>
                <div class="flower__light flower__light--1"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--3"></div>
            </div>
        </div>

        <div id="middle-flower" class="flower-container" style="--base-transform: scale(1.1);">
            <div class="stem"></div>
            <div class="flower__leafs">
                <div class="petal petal--1"></div>
                <div class="petal petal--2"></div>
                <div class="petal petal--3"></div>
                <div class="petal petal--4"></div>
                <div class="flower__light flower__light--1"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--3"></div>
                <div class="flower__light flower__light--4"></div>
                <div class="flower__light flower__light--5"></div>
            </div>
        </div>

        <div class="flower-container" style="--base-transform: scale(0.9) rotate(15deg);">
            <div class="stem"></div>
            <div class="flower__leafs">
                <div class="petal petal--1"></div>
                <div class="petal petal--2"></div>
                <div class="petal petal--3"></div>
                <div class="petal petal--4"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--4"></div>
                <div class="flower__light flower__light--5"></div>
            </div>
        </div>
    </div>

    <div id="birthday-overlay" class="birthday-overlay">
        <div class="birthday-content">
            <span id="close-frame" class="close-frame">&times;</span>
            <h1>Chúc Mừng Sinh Nhật Người Đẹp!</h1>
            <p>Chúc bà một tuổi mới đầy niềm vui, hạnh phúc và thành công. Mong rằng mọi ước mơ của bạn sẽ trở thành hiện thực!</p>
        </div>
    </div>

    <script>
        // PHẦN MỚI: JavaScript để xử lý sự kiện nhấp chuột

        const middleFlower = document.getElementById('middle-flower');
        const birthdayOverlay = document.getElementById('birthday-overlay');
        const closeFrame = document.getElementById('close-frame');

        // Khi nhấp vào bông hoa ở giữa
        middleFlower.addEventListener('click', function() {
            birthdayOverlay.classList.add('active');

            document.getElementById('bg-music').play(); 
        });
        closeFrame.addEventListener('click', function() {
            birthdayOverlay.classList.remove('active');
        
        });
        // Khi nhấp vào nút đóng
        closeFrame.addEventListener('click', function() {
            birthdayOverlay.classList.remove('active');
        });

        // Khi nhấp ra ngoài khung nội dung (vào phần nền mờ)
        birthdayOverlay.addEventListener('click', function(event) {
            if (event.target === birthdayOverlay) {
                birthdayOverlay.classList.remove('active');
            }
        });
    </script>
<audio id="bg-music" src="nhac-nen.mp3" loop></audio>
</body>
</html>
